product: mekras/ai-dev-team
applied_version: 0.25.0
updated_at: 2026-08-10

project:
  apm:
    role: publisher
    client_instructions: preserve_handwritten_local_rules
  license: MIT

setup:
  operating_context:
    kind: noncommercial
  project_profile:
    forms:
      - ai-skills
    users:
      - developers configuring AI agents
      - AI agents applying Russian-language rules
    interfaces:
      - no user interface
    delivery:
      - published APM package
  visibility: public
  git:
    enabled: true
  commit_messages:
    scheme: pro-git
  changelog:
    status: present
    path: CHANGELOG.md
  client_instructions:
    status: handwritten_local_rules_preserved
    files:
      - AGENTS.md
  knowledge:
    status: present
    path: knowledge/
  decision_records:
    status: present
    journals:
      - kind: DR
        path: docs/DR/
        record_pattern: DR-NNNN.md
        index: docs/DR/README.md
    acceptance: owner_approval
    priority_factors:
      - reliability_of_rules
      - context_efficiency
  impact_graph:
    status: present
    path: project-impact.json
    schema_version: 2
