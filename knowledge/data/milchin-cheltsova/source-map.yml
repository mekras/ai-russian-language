- В отслеживаемом слое сохраняются самостоятельные формулировки правил и фактические словесные соответствия. Авторские
  переводные толкования и подбор литературных примеров не воспроизводятся.
quality_observations:
- section: 6.4.5
  observation: Знак, названный символом рубля, извлекается как U+00A4. Облик в исходной гарнитуре отдельно не установлен.
  handling: Не переносить кодовую точку как действующий символ рубля.
- section: 13.11.5
  observation: Указание о не более чем трёх значащих цифрах для относительных величин соседствует с примерами 145,4 и
    1247,9.
  handling: Общий принцип достаточной точности отделён от частного числового ориентира.
- section: 13.11.7
  observation: В примере смены единицы для тиража 74 000 до обработки соответствует 75 после перехода к тысячам.
  handling: Образец не принят как точный пересчёт. Исходные данные не исправлялись.
- section: 13.15.3
  observation: В изображениях 146045.png и 146027.png значение для серы в первом примере меняется с 0,04 на ≤0,4.
  handling: Иллюстрация используется для разбора оформления. Её числовые нормы не извлекаются для проекта.
- section: Приложение 1
  observation: В таблице Пасхи год 1849 указан дважды, а 1848 не найден.
  handling: Не использовать последовательность строк как проверенный календарный расчёт.
- section: Приложение 2
  observation: В изображении 194349.png VIII сопоставлено и 7, и 8; DCCC — числу 700.
  handling: Не принимать эти строки как проверенные числовые соответствия.
- section: Приложение 6
  observation: Строка 79 × 84 имеет коэффициент 1,09, не соответствующий изложенному отношению площадей.
  handling: Не исправлять источник по предположению; рассчитывать по определению и отдельно проверять формат.
- section: Приложение 7
  observation: Перевод bimonthly дан как двухнедельный. Семантическая неоднозначность частоты независимо не проверялась.
  handling: Не переносить строку как универсальную переводную норму.
- section: 3.11.1
  observation: В заголовке исходного текста первый знак номера записан кириллической буквой З.
  handling: Исходный текст сохранён. Для сопоставления с цифровыми номерами используется структурная единица unit-0193.
