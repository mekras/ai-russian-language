concepts:
  - id: project-knowledge-corpus
    primary: "корпус знаний проекта"
    definition: "Проверяемый слой проекта в knowledge/, где по переносимому договору версии 2 учитываются источники и утверждения для обоснования изменений навыков и документации."
    boundaries:
      includes:
        - "Источники, их метаданные, проверяемые утверждения и связи с проектными изменениями."
        - "Отслеживаемые безопасные материалы и отделённый от них локальный слой."
      excludes:
        - "Материалы, публикация которых не разрешена правилами источника или проекта."
        - "Принятие проектных решений вместо владельца проекта."
