product: mekras/ai-dev-team
applied_version: 0.29.7
updated_at: 2026-10-19

project:
  apm:
    role: publisher
    client_instructions: preserve_handwritten_local_rules
  license: MIT

setup:
  operating_context:
    kind: noncommercial
  project_profile:
    forms:
      - ai-skills
    users:
      - developers configuring AI agents
      - AI agents applying Russian-language rules
    interfaces:
      - no graphical user interface
      - CLI for maintainers
    delivery:
      - published APM package
  visibility: public
  git:
    enabled: true
  subagents:
    status: creation_declined
    reason: disabled_by_project_owner
  commit_messages:
    scheme: pro-git
  changelog:
    status: present
    path: CHANGELOG.md
  client_instructions:
    status: handwritten_local_rules_preserved
    files:
      - AGENTS.md
  knowledge:
    status: present
    path: knowledge/
    operations:
      path: knowledge/operations.yml
      semantic_executor: primary_agent
      local_source_operations: probe_only
  decision_records:
    status: present
    journals:
      - kind: DR
        path: docs/DR/
        record_pattern: DR-NNNN.md
        index: docs/DR/README.md
    acceptance: owner_approval
    priority_factors:
      - reliability_of_rules
      - context_efficiency
  impact_graph:
    status: present
    path: project-impact.json
    schema_version: 2
  interface_checks:
    level: required
    scope: maintainer_cli
  review:
    checked_at: '2026-10-19'
    method: self_review
    version_review:
      from: 0.29.6
      to: 0.29.7
      basis: CHANGELOG.md установленного ai-dev-team, раздел 0.29.7
      result: Обязательных действий при обновлении нет. Прежнее правило проверок команд сохранено.
    current_run:
      scope: Повторная настройка без изменения концепции, правил и структуры проекта
      reused_evidence: Прежние свидетельства направлений сверены с текущими файлами. Новых проектных решений нет.
      checks:
      - 'apm audit --ci: код 0, все 10 проверок пройдены, дрейфа нет.'
      - 'apm run tests: код 0. Проверены доставка оснастки, 78 файлов, сценарии выбора и структура 70 compose-сценариев.'
      - 'apm pack --dry-run: код 0, 26 файлов. Использован существующий plugin.json.'
      - 'Строгая проверка корпуса: код 0, один источник, ошибок и предупреждений нет.'
      - Проверены локальный EPUB, хэши нормализации, выдержки 3895 утверждений и связи карты охвата.
      - Содержательно просмотрены первое, среднее и последнее утверждения с их областью и ограничениями.
      - 'Непустой запуск через контроллер корпуса: probe локальной книги завершился кодом 0 и статусом ready, данные не изменены.'
      - 'Граф влияния: схема 2, 10 вершин, 11 рёбер. Покрыты 76 путей, исключены 13, несопоставленных нет.'
      - 'trace и assess: влияние изменения зависимости на правила агентов закрыто. Изменения состояния и журнала не затрагивают другие вершины.'
      evaluation:
        method: self_review
        result: accept
        basis: Все 15 направлений сверены. Прежние решения сохранены, проверки завершились без ошибок, результат соответствует концепции.
      limitations:
      - Самопроверка не является независимой проверкой.
      - Новая корневая сессия, загрузка правил клиентом Claude и модельное применение навыков не испытывались.
      - Удалённая установка, полный выпуск и независимая сверка всех утверждений с издательским оригиналом не выполнялись.
    directions:
    - name: рабочий контекст проекта
      status: сделано
      basis: 'Ранее принятое setup.operating_context.kind: noncommercial'
      evidence:
      - Контекст сохранён в state.yml и повторно использован без нового выбора.
      limitations: []
    - name: профиль проекта
      status: сделано
      basis: Публикуемая коллекция навыков русского языка для разработчиков и агентов
      evidence:
      - 'README.md: назначение, установка для Codex и Claude, первое применение через маркер ru-lang.'
      - 'apm.yml: собственный навык .apm/skills/ru-lang, includes: auto, зависимость ru-text и средство разработки
        ai-dev-team.'
      limitations: []
    - name: концепция проекта
      status: сделано
      basis: Принятая концепция в README.md, указатель в AGENTS.md
      evidence:
      - 'Самопроверка через ait-docs-concept: проблема правильного применения русского языка, цель, переносимые навыки
        как способ и устанавливаемая коллекция как результат согласованы.'
      - Содержание README.md и назначение проекта сохранены.
      limitations: []
    - name: README.md
      status: сделано
      basis: Основной читатель — разработчик, подключающий правила русского языка к агенту
      evidence:
      - 'Самопроверка через ait-readme: понятное назначение, команды реестра и установки, доступные навыки и первое
        применение описаны до сопровождения.'
      - Разделы разработки и выпуска отделены от пользовательской установки. Команды tests и состав пакета проверены
        локально.
      limitations:
      - Повторная установка из удалённого реестра и модельное применение в этой настройке не выполнялись.
    - name: правила для агентов и клиентские инструкции
      status: сделано
      basis: Рукописный AGENTS.md сохраняется по принятому решению
      evidence:
      - 'Самопроверка ai-audit-agent-rules: корневые правила поступили в текущую сессию, CLAUDE.md содержит @AGENTS.md,
        дублирования правил нет.'
      - AGENTS.md задаёт границу записи, Git, pro-git, корпус, порядок решений и запрет подагентов. Конфликтов в проверенной
        цепочке не найдено.
      - В обеих проекциях доступны ait-routing, ai-human-communication и справка human-texts.md. Маршрутизатор открывает
        их до первого сообщения.
      - 'apm audit --ci: код 0, 10 из 10 проверок, дрейфа нет. Версия 0.29.7.'
      limitations:
      - Выполнена самопроверка. Поведение новой корневой сессии и загрузка CLAUDE.md клиентом Claude не наблюдались.
    - name: журнал изменений
      status: сделано
      basis: CHANGELOG.md и обязательное правило ait-changelog в AGENTS.md
      evidence:
      - 'Самопроверка ait-changelog: формат Keep a Changelog и SemVer, раздел «Не выпущено», обновление ai-dev-team
        до 0.29.7 отражено.'
      - Служебная сверка настройки не меняет пользовательское поведение коллекции и отдельной записи не требует.
      limitations: []
    - name: журналы решений
      status: сделано
      basis: Единый журнал всех значимых долгоживущих решений проекта в docs/DR/
      evidence:
      - 'Самопроверка ait-decisions: README журнала задаёт область, статусы, имена DR-NNNN и реестр. Все три записи
        перечислены и имеют статус «Принято».'
      - 'DR-0001 и AGENTS.md согласованы: решение до действия, ручное принятие, сначала надёжность правил, затем экономия
        контекста.'
      - DR-0002 и DR-0003 относятся к правилам русского языка из концепции. Миграция существующего общего журнала
        не требуется.
      limitations: []
    - name: корпус знаний
      status: сделано
      basis: Корпус knowledge/ и ранее принятая политика допуска
      evidence:
      - 'Самопроверка kc-setup и kc-validation: путь, договор версии 2, источник, индексы, карта охвата, понятия и
        операционный контур согласованы.'
      - 'Строгая проверка validate-corpus-layout.py с operational, strict-admission, strict-statements, strict-concepts
        и strict-verification: код 0, ошибок и предупреждений нет.'
      - '«Справочник издателя и автора»: локальная целостность EPUB, хэши нормализации, выдержки 3895 утверждений
        и связи карты охвата проверены check_book_excerpts. Содержательно просмотрена выборка из трёх утверждений
        с их областью и ограничениями.'
      - Допуск источника хранится вне корпуса, хэш и область проверены. Собственные файлы проекта и рабочие разговоры
        запрещены.
      - Механические очереди traceability, source_check, verification, corpus_validation обеспечены tools/corpus-local-document.py.
        Получение книги выполняется точечно по договору local_only и on_demand, адаптер зарегистрирован только для
        probe. Медиа для transcribe нет.
      - Смысловые очереди content_selection, normalize, statements, coverage_gap, semantic_review, strong_review,
        corroboration, concepts, impact_audit и apply_changes выполняет основной агент. Индексы пересобирает контроллер.
        Изменения продукта только предлагаются.
      - Планирование run-corpus-operations.py завершилось кодом 0. Предметные очереди пусты, четыре глобальные стадии
        полного прохода не закрыты.
      - 'Непустой запуск адаптера через контроллер: probe для MILCHIN-CHELTSOVA завершился кодом 0 и статусом ready,
        данные не изменены.'
      limitations:
      - Сверка с издательским оригиналом и независимая содержательная проверка всех утверждений не выполнялись.
      - Прямой запуск probe и непустая проверка существующих данных не доказывают работу всех записывающих ветвей.
      - Полный проход корпуса и перенос его сведений в продукт не входят в эту настройку.
      - Поиск по карточке, утверждениям и индексам не дал оснований о настройке APM и агентов.
    - name: разработка на основе спецификаций
      status: не требуется
      basis: Условия инициативной оценки ait-reconstructability не выполнены
      evidence:
      - Проект версии 2.1.6 уже имеет канонические рукописные навыки и устоявшуюся поставку. Запроса на восстановление,
        новую реализацию или превращение навыков в производные артефакты нет.
      - Настройка не меняет границу канонических и производных материалов. Использование APM само по себе не служит
        основанием для принятия подхода.
      limitations: []
