      basis: project-impact.json указан в AGENTS.md и setup.impact_graph
      evidence:
      - 'ait-impact-analysis validate: схема 2, 10 вершин, 11 рёбер, проблем нет.'
      - 'coverage: полное покрытие, 76 сопоставленных путей, 13 исключённых, несопоставленных нет.'
      - 'Изменение служебных данных state.yml проверено trace и assess с аспектом data: зависимых вершин нет,
        анализ завершён.'
      limitations: []
    - name: интерфейсные проверки
      status: сделано
      basis: README.md предлагает сопровождающему команды tests и evals, у них есть текстовое взаимодействие с человеком
      evidence:
      - Пользователь выбрал вариант 1 — обязательные автоматические проверки изменений команд.
      - 'AGENTS.md, раздел «Проверки команд»: до реализации определяются обязательные сценарии,
        задача завершается только после их успешного прогона. Пропуск проверки блокирует завершение.'
      - 'В setup.interface_checks сохранены level: required и область maintainer_cli.'
      - Самопроверка ai-audit-agent-rules подтвердила условие применения, действие и критерий завершения.
      limitations: []
    - name: .gitignore
      status: сделано
      basis: Git и наблюдаемые локальные артефакты Python, APM и корпуса
      evidence:
