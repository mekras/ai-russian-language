      limitations: []
    - name: Git, сообщения коммитов и проверки
      status: сделано
      basis: Приняты pro-git и немедленное добавление неигнорируемых изменений в индекс
      evidence:
      - 'Проверка доставки всех назначений scripts/eval-tools/manifest.txt: код 0, совпадение с установленным источником
        ai-setup-apm. Переустановка не требовалась.'
      - 'apm run tests: код 0, 78 файлов проверены на скрытые символы, описание и сценарии выбора навыка проверены,
