decision: >-
  Допустить «Справочник издателя и автора» Мильчина и Чельцовой, пятое издание.
  Допустить извлечение и сохранение максимально полного набора применимых к проекту
  правил, принципов, методов и фактов в самостоятельном изложении с указанием источника
  и места в нём. Полноту не ограничивать заранее заданным количеством утверждений. Не
  воспроизводить без правового основания охраняемые формулировки, объяснения, примеры и
  творческий подбор или расположение материалов. Цитирование оценивать по условиям
  статьи 1274 ГК РФ. Проверять отдельные утверждения и совокупный результат.
