name: ai-russian-language
version: 2.1.5
description: "Коллекция переносимых навыков для русского языка в агентной разработке"
author: "mekras"
license: "MIT"
type: "skill"
target:
  - agent-skills
  - claude
  - codex
includes: auto
dependencies:
  apm:
    - talkstream/ru-text#v2.4.0
  mcp: []
scripts:
  tests: "sh -c 'set -e; target=\"${APM_EVAL_PATH:-.apm/skills}\"; python3 tools/validate-hidden-unicode.py; python3 tools/validate-skill-descriptions.py \"$target\"; python3 tools/validate-trigger-evals.py \"$target\" --require-all; python3 tools/run_skill_evals.py \"$target\" --checks compose --validate-only'"
  evals: "python3 tools/run_skill_evals.py \"${APM_EVAL_PATH:-.apm/skills}\""
devDependencies:
  apm:
    - mekras/ai-dev-team#0.25.0
marketplace:
  name: ai-russian-language
  description: "Реестр переносимых навыков для агентов ИИ"
  owner:
    name: mekras
    url: https://github.com/mekras
  build:
    tagPattern: "{version}"
  outputs:
    claude: {}
    codex: {}
  packages:
    - name: ai-russian-language
      description: "Переносимые навыки русского языка для агентов ИИ"
      source: mekras/ai-russian-language
      version: "^2.1.5"
      category: Productivity
