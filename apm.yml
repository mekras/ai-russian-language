name: ai-russian-language
version: 2.1.5
description: "Коллекция переносимых навыков для русского языка в агентной разработке"
author: "mekras"
license: "MIT"
type: "skill"
target:
  - agent-skills
  - claude
  - codex
includes: auto
dependencies:
  apm:
    - talkstream/ru-text#v2.4.0
  mcp: []
scripts:
  tests: "sh -c 'set -e; export PYTHONDONTWRITEBYTECODE=1; target=\"${APM_EVAL_PATH:-.apm/skills}\"; python3 tools/validate-python-artifacts.py; python3 .agents/skills/ai-setup-apm/scripts/eval-tools/check-eval-tools-drift.py; python3 tools/validate-hidden-unicode.py; python3 tools/validate-skill-descriptions.py \"$target\"; python3 tools/validate-trigger-evals.py \"$target\" --require-all; python3 tools/run_skill_evals.py \"$target\" --checks compose --validate-only; python3 tools/validate-python-artifacts.py'"
  evals: "python3 tools/run_skill_evals.py \"${APM_EVAL_PATH:-.apm/skills}\""
devDependencies:
  apm:
    - mekras/ai-dev-team#0.29.2
